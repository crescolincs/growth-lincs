local_backend: true

backend:
  name: github
  repo: crescolincs/growth-lincs #path to your GitHub repository
  branch: main
  base_url: https://smc.agrifood.pages.dev #url for Oauth app on Github Developer settings
  auth_endpoint: /api/auth
  show_preview_links: true

media_folder: "/images" # Folder where user uploaded files should go
public_folder: "/images"

media_library:
  name: cloudinary
  config:
    cloud_name: growthlincs
    api_key: "911638456544281"
    multiple: false
    output_filename_only: false

#publish_mode: editorial_workflow
logo_url: https://res.cloudinary.com/growthlincs/image/upload/v1790092872/lcc-logo.svg




collections:

  - name: "relation_files"
    label: "Authors & Categories"
    files:
      - name: "authors"
        label: "Authors"
        file: "data/authors.yml"
        media_folder: ""
        public_folder: ""
        fields:
          - label: "Authors"
            name: "authors"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Bio", name: "bio", widget: "text", required: false}

      - name: "categories"
        label: "Categories"
        file: "data/categories.yml"
        media_folder: ""
        public_folder: ""
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
  # ---------------------------------------------------------------
  # GEGROWTH ARTICLES
  # ---------------------------------------------------------------
  - name: "articles"
    label: "Growth Articles"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Sub Heading", name: "sub_heading", widget: "string", required: false }
      - {label: "Sector", name: "sector", widget: "hidden", default: "agrifood"}
      - {label: "Type", name: "type", widget: "hidden", default: "article"} 
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}

      - label: "Author"
        name: "author"
        widget: "relation"
        collection: "relation_files"
        file: "authors"
        search_fields: ["authors.*.name"]
        display_fields: ["authors.*.name"]
        value_field: "authors.*.name"
        multiple: true

      - label: "Categories"
        name: "categories"
        widget: "relation"
        collection: "relation_files"
        file: "categories"
        search_fields: ["categories.*.name"]
        display_fields: ["categories.*.name"]
        value_field: "categories.*.name"
        multiple: true

      - { label: "Hero Image", name: "image", widget: "image", required: false }

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: true

      - label: "Display"
        name: "display"
        widget: "boolean"
        default: true
        hint: "Untick to hide this article from the live site without deleting it."

      - {label: "Intro Blurb", name: "intro", widget: "text", required: false}
      - { label: "Body", name: "body", widget: "markdown" }
      - {label: "SEO Description", name: "SEODesc", widget: "text", required: false} 

  # ---------------------------------------------------------------
  # E-BULLETINS
  # ---------------------------------------------------------------
  - name: "ebulletins"
    label: "E-Bulletins"
    folder: "content/ebulletins"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Screengrab", name: "screengrab", widget: "image" }
      - { label: "Link to E-Bulletin", name: "linkToEBulletin", widget: "string" }
      - { label: "E-Bulletin Description", name: "eBulletinDescription", widget: "richtext" }

      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: true

      - label: "Display"
        name: "display"
        widget: "boolean"
        default: true
        hint: "Untick to hide this E-Bulletin from the live site without deleting it."
  