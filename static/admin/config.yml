local_backend: true

backend:
  name: github
  repo: crescolincs/growth-lincs #path to your GitHub repository
  branch: main
  base_url: https://smc.agrifood.pages.dev #url for Oauth app on Github Developer settings
  auth_endpoint: /api/auth

media_library:
  name: cloudinary
  config:
    cloud_name: growthlincs
    api_key: 911638456544281
    multiple: false
    output_filename_only: true

publish_mode: editorial_workflow
logo_url: https://res.cloudinary.com/lincs/image/upload/v1716044699/invest-lincolnshire-logo.svg


#media_folder: "" # Folder where user uploaded files should go
#public_folder: ""

collections:

  # ---------------------------------------------------------------
  # GEGROWTH ARTICLES
  # ---------------------------------------------------------------
  - name: "articles"
    label: "Growth Articles"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"        # Hugo page-bundle style; drop this line if you use flat .md files
    extension: "md"
    format: "yaml"
    fields:
      - { label: "Heading", name: "heading", widget: "string" }
      - { label: "Sub Heading", name: "sub_heading", widget: "string", required: false }

      - label: "Author"
        name: "author"
        widget: "relation"
        collection: "authors"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"   # stores the author's slug, not the display name
        multiple: false

      - label: "Categories"
        name: "categories"
        widget: "relation"
        collection: "categories"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"
        multiple: true
        min: 1

      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }

      - label: "Publish Date"
        name: "publish_date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: true

      - label: "Last Updated"
        name: "latestupdate_date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: true
        required: false

      - label: "Display"
        name: "display"
        widget: "boolean"
        default: true
        hint: "Untick to hide this article from the live site without deleting it."

      - { label: "Content", name: "body", widget: "markdown" }

  # ---------------------------------------------------------------
  # E-BULLETINS
  # ---------------------------------------------------------------
  - name: "ebulletins"
    label: "E-Bulletins"
    folder: "content/ebulletins"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    extension: "md"
    format: "yaml"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Screengrab", name: "screengrab", widget: "image" }
      - { label: "Link to E-Bulletin", name: "linkToEBulletin", widget: "string" }
      - { label: "E-Bulletin Description", name: "eBulletinDescription", widget: "text" }

      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: true

      - label: "Display"
        name: "display"
        widget: "boolean"
        default: true
        hint: "Untick to hide this E-Bulletin from the live site without deleting it."
  # ---------------------------------------------------------------
  # AUTHORS (supporting data — used via Relation widget)
  # ---------------------------------------------------------------
  - name: "authors"
    label: "Authors"
    folder: "content/authors"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      # no `body` field needed — this collection only holds data, no long-form content

  # ---------------------------------------------------------------
  # CATEGORIES (supporting data — used via Relation widget)
  # ---------------------------------------------------------------
  - name: "categories"
    label: "Categories"
    folder: "content/categories"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Category Name", name: "title", widget: "string" }
