backend:
  name: github
  repo: crescolincs/growth-lincs   # <-- update to your actual GitHub org/repo
  branch: main
  # If editors will authenticate via GitHub OAuth directly (not Netlify Identity),
  # you'll need a small OAuth provider app — see note below the config.

publish_mode: editorial_workflow

# ---------------------------------------------------------------------------
# MEDIA STORAGE — pick ONE approach and delete/comment the other.
# ---------------------------------------------------------------------------

# OPTION A: store images in the repo (simple, but repo grows with post count)
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

# OPTION B: Cloudinary (repo stays small; images served from Cloudinary's CDN)
# Comment out the two lines above and uncomment this block instead.
# media_library:
#   name: cloudinary
#   config:
#     cloud_name: your-cloud-name
#     api_key: your-api-key
#     # no api_secret here — uploads use an unsigned preset or signed request
#     # handled by Decap; never put your Cloudinary API secret in this file.

collections:

  # ---------------------------------------------------------------
  # GENERAL POSTS
  # ---------------------------------------------------------------
  - name: "posts"
    label: "General Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"        # Hugo page-bundle style; drop this line if you use flat .md files
    extension: "md"
    format: "yaml"
    fields:
      - { label: "Heading", name: "heading", widget: "string" }
      - { label: "Sub Heading", name: "sub_heading", widget: "string", required: false }

      - label: "Author"
        name: "author"
        widget: "relation"
        collection: "authors"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"   # stores the author's slug, not the display name
        multiple: false

      - label: "Categories"
        name: "categories"
        widget: "relation"
        collection: "categories"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"
        multiple: true
        min: 1

      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }

      - label: "Publish Date"
        name: "publish_date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: true

      - label: "Last Updated"
        name: "latestupdate_date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: true
        required: false

      - label: "Display"
        name: "display"
        widget: "boolean"
        default: true
        hint: "Untick to hide this post from the live site without deleting it."

      - { label: "Content", name: "body", widget: "markdown" }

  # ---------------------------------------------------------------
  # E-BULLETINS
  # ---------------------------------------------------------------
  - name: "ebulletins"
    label: "E-Bulletins"
    folder: "content/ebulletins"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    extension: "md"
    format: "yaml"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Screengrab", name: "screengrab", widget: "image" }
      - { label: "Link to E-Bulletin", name: "linkToEBulletin", widget: "string" }
      - { label: "E-Bulletin Description", name: "eBulletinDescription", widget: "text" }

      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: true

      - label: "Display"
        name: "display"
        widget: "boolean"
        default: true

  # ---------------------------------------------------------------
  # AUTHORS (supporting data — used via Relation widget)
  # ---------------------------------------------------------------
  - name: "authors"
    label: "Authors"
    folder: "content/authors"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    extension: "md"
    format: "yaml"
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      # no `body` field needed — this collection only holds data, no long-form content

  # ---------------------------------------------------------------
  # CATEGORIES (supporting data — used via Relation widget)
  # ---------------------------------------------------------------
  - name: "categories"
    label: "Categories"
    folder: "content/categories"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    extension: "md"
    format: "yaml"
    fields:
      - { label: "Category Name", name: "title", widget: "string" }
