{{ define "main" }}
<div class="container growth_default_list">
  <div class="row">
  <div class="col-12">
  <h1>{{ .Title }}</h1>
    
    {{ range .Pages }}
       <div>
        {{ with .Params.image }}
          {{ $url := . }}
             {{ with resources.GetRemote $url }}
               {{ with .Resize "400x" }}
                 <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="">
               {{ end }}
              {{ end }}
        {{ end }}
         <h3><a style="text-decoration: none;" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>



         {{ .Summary }}
         
       </div>
    {{ end }}
  </div>
  </div>
</div>
{{ end }}
