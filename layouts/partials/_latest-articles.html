      grid-template-columns: 360px 360px 360px;
  }

      grid-template-columns: 32.5% 32.5% 32.5%;
  }

.card {
  display: grid;
  /* Span across all 4 rows defined in the parent container */
  grid-row: span 3;
  /* Inherit the row tracks from the parent grid */
  grid-template-rows: subgrid;
}
img {
  padding:0;
  height: 100%;
  -o-object-fit: cover;
  object-fit: cover;
  width: 100%;
}
.card-header{ 
    padding: 0; /*var(--bs-card-cap-padding-x)*/
    background-color: #fff;
    border-bottom: none;
    height: 15.625rem;
}
.card-footer {
  background-color: #fff;
  border-top: none;
    a{
    text-decoration: none;
}
}
    .title-color{
    color: #28347E;
    }

  <div class="container">
    <h2 class="h2-large text-dark-blue">Latest Articles</h2>
      <div class="xrow dashboard">

         
         {{ range first 3 (where site.RegularPages "Type" "articles") }}
           <!-- <div class="position-relative sector_{{.Params.sector}}"> -->
                <div class="card shadow">
                    <div class="card-header">
                        {{ $url2resize := .Params.image  }}
                           {{ $transformedUrl := replaceRE `v\d+` "f_auto,q_auto,w_420" $url2resize }}
                             <img loading="lazy" src="{{ $transformedUrl }}" alt="{{ .Params.title }}">
                        
                    </div>
                    <div class="card-body">
                          <!--{{ if .Params.categories }}
                             {{ partial "category-links.html" . }}
                          {{ end }} -->   
                        <!--<p class="text-sector-mid"><small>{{ .Params.sector | strings.FirstUpper }}</small></p>-->
                        <h4 class="title-color">
                            {{ .Params.title}}
                        </h4>
                        <div>{{ .Summary | truncate 100 }}</div>
                    </div>
                    <div class="card-footer d-flex justify-content-end">
                       <a href="{{ .RelPermalink }}">read article</a>
                    </div>
                </div>
            <!--</div>-->
           {{ end }}

      </div>
      <div class="col-12 d-flex justify-content-center"><a class="btn btn-primary mt-4" href="/contact">See All Articles <i xxxclass="fa-sharp fa-regular fa-arrow-right ms-3"><svg fill="#fff" width="26.5" height="30" viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg"><path d="M5.975 17.504l14.287.001-6.367 6.366L16.021 26l10.004-10.003L16.029 6l-2.128 2.129 6.367 6.366H5.977z"></path></svg></i></a></div>
  </div>
